name: Pixel6 GS13 SUSFS Kernel (KernelSU-Next)
run-name: "Pixel6 A13: ${{ inputs.build_name }}"

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Build Name"
        required: false
        type: string
        default: "Pixel6-A13"
      kernel_branch:
        description: "AOSP android-gs kernel branch"
        required: false
        type: string
        default: "android-gs-raviole-5.10-android13-qpr3"
      ksu_repo:
        description: "KernelSU-Next repo (SUSFS-integrated)"
        required: false
        type: string
        default: "https://github.com/shoey63/KernelSU-Next.git"
      ksu_ref:
        description: "KernelSU-Next branch/tag"
        required: false
        type: string
        default: "stable"
      susfs_branch:
        description: "SUSFS branch"
        required: false
        type: string
        default: "gki-android13-5.10"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl cpio lz4 flex bison bc \
            libssl-dev libelf-dev binutils-aarch64-linux-gnu \
            clang lld llvm dwarves python3

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            https://android.googlesource.com/kernel/common kernel
          cd kernel
          echo ">>> Kernel HEAD: $(git rev-parse --short HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' '; echo

      - name: Integrate KernelSU (tiann)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v3.3.1
          echo ">>> KernelSU integrated: $(cd KernelSU && git describe --tags 2>/dev/null || git rev-parse --short HEAD)"

      - name: Integrate SUSFS (kernel side, vendored)
        run: |
          cd kernel
          SUSFS_DIR="$GITHUB_WORKSPACE/tools/susfs_a13"
          PATCH=$(find "$SUSFS_DIR" -maxdepth 1 -name '50_add_susfs_in_*.patch' | head -n1)
          echo ">>> Using vendored patch: $PATCH"
          cp -f "$PATCH" .
          cp -rf "$SUSFS_DIR/fs/"* fs/
          cp -rf "$SUSFS_DIR/include/linux/"* include/linux/
          patch -p1 --no-backup-if-mismatch < "$(basename "$PATCH")" || echo "[!] SUSFS patch had rejects (some are expected)"

      - name: Apply SUSFS KSU patch
        run: |
          cd kernel/KernelSU
          patch -p1 < "$GITHUB_WORKSPACE/tools/susfs_a13/10_enable_susfs_for_ksu.patch" || echo "[!] KSU SUSFS patch rejects"

      - name: Configure SUSFS + KSU
        run: |
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_KSU_SUSFS_SUS_MAP is not set" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS is not set" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_LTO_CLANG_FULL is not set" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_LTO_CLANG_THIN is not set" >> arch/arm64/configs/gki_defconfig
          echo "# CONFIG_CFI_CLANG is not set" >> arch/arm64/configs/gki_defconfig
          echo ">>> Config appended"

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out LLVM=1 gki_defconfig
          make O=out LLVM=1 -j$(nproc)
          grep -q "CONFIG_KSU=y" out/.config && echo "[+] KSU enabled"
          grep -q "CONFIG_KSU_SUSFS=y" out/.config && echo "[+] SUSFS enabled"
          lz4 -c -l -12 out/arch/arm64/boot/Image > out/Image.lz4
          ls -lh out/arch/arm64/boot/Image out/Image.lz4

      - name: Package AnyKernel3
        run: |
          mkdir -p ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3-src
          cp -rf ak3-src/* ak3/
          rm -rf ak3/.git ak3/README.md
          rm -f ak3/Image ak3/Image.lz4 ak3/anykernel.sh 2>/dev/null || true
          cp kernel/out/Image.lz4 ak3/Image.lz4
          printf '%s\n' \
            '### AnyKernel3 Ramdisk Mod Script' \
            "properties() { '" \
            'kernel.string=Pixel6 A13 KSU-Next SUSFS' \
            'do.devicecheck=0' \
            'do.modules=0' \
            'do.systemless=1' \
            'do.cleanup=1' \
            'device.name1=' \
            "'; }" \
            'BLOCK=/dev/block/by-name/boot;' \
            'IS_SLOT_DEVICE=1;' \
            'RAMDISK_COMPRESSION=auto;' \
            'PATCH_VBMETA_FLAG=auto;' \
            '. ./tools/ak3-core.sh;' \
            'split_boot;' \
            'flash_boot;' \
            > ak3/anykernel.sh
          cd ak3
          zip -r9 "../${{ inputs.build_name }}-KSU-Next-SUSFS-AK3.zip" .
          cd ..
          ls -lh *AK3.zip

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_name }}-KSU-Next-SUSFS
          path: |
            *AK3.zip
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
